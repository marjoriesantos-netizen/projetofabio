<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NFT card list component — Frontend Mentor challenge phase 1.1"
    />
    <title>NFT Card List | Phase 1.1</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/cardlist.css" />
  </head>

  <body>
    <div class="page">
      <main class="page__main">
        <div class="container">
          <div class="cardlist-intro">
            <div>
              <h1 class="section-heading">Featured <span>Collection</span></h1>
              <p class="section-subheading">
                Seven unique drops minted on the Ethereum network. Every card is
                built from the same component, driven by a single data file.
              </p>
            </div>

            <p class="cardlist-intro__count">
              <strong id="cardlist-count">0</strong> unique drops
            </p>
          </div>

          <div class="cardlist-section">
            <!-- Cards are injected by js/main.js from js/data.js -->
            <div class="cardlist" id="cardlist"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
