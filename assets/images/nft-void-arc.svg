<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600" role="img">
  <defs>
    <linearGradient id="bg-void" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="soft-void" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="grain-void" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="700" height="600" fill="#05070d" />
  <g filter="url(#soft-void)" opacity="0.95">
      <circle cx="333" cy="178" r="203" fill="#0ea5e9" />
      <circle cx="118" cy="186" r="200" fill="#334155" />
      <circle cx="380" cy="458" r="208" fill="#1d4ed8" />
      <circle cx="289" cy="422" r="200" fill="#64748b" />
  </g>
  
  <g fill="none" stroke="#7dd3fc" opacity="0.35">
    <circle cx="350" cy="300" r="150" stroke-width="1.5" />
    <circle cx="350" cy="300" r="205" stroke-width="1" />
    <circle cx="350" cy="300" r="265" stroke-width="0.75" />
  </g>
  <rect width="700" height="600" fill="#38bdf8" opacity="0.06" />
  <rect width="700" height="600" filter="url(#grain-void)" opacity="0.14" style="mix-blend-mode:overlay" />
</svg>
