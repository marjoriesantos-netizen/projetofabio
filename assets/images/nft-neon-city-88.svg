<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600" role="img">
  <defs>
    <linearGradient id="bg-city" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2e74" />
      <stop offset="100%" stop-color="#3d0a52" />
    </linearGradient>
    <filter id="soft-city" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="grain-city" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="700" height="600" fill="#1a0326" />
  <g filter="url(#soft-city)" opacity="0.95">
      <circle cx="217" cy="185" r="101" fill="#ff2e74" />
      <circle cx="597" cy="76" r="153" fill="#ff8f3f" />
      <circle cx="219" cy="186" r="131" fill="#7b1fa2" />
      <circle cx="430" cy="408" r="90" fill="#ff5fa2" />
  </g>
  
  <g fill="#1a0326" opacity="0.85">
    <rect x="60" y="330" width="52" height="210" rx="6" />
    <rect x="128" y="270" width="44" height="270" rx="6" />
    <rect x="188" y="360" width="60" height="180" rx="6" />
    <rect x="264" y="220" width="50" height="320" rx="6" />
    <rect x="330" y="310" width="46" height="230" rx="6" />
    <rect x="392" y="255" width="58" height="285" rx="6" />
    <rect x="466" y="350" width="44" height="190" rx="6" />
    <rect x="526" y="295" width="54" height="245" rx="6" />
    <rect x="596" y="375" width="46" height="165" rx="6" />
  </g>
  <circle cx="520" cy="150" r="62" fill="#ffb35c" opacity="0.9" />
  <g fill="#ffd9a0" opacity="0.7">
    <rect x="276" y="250" width="8" height="8" /><rect x="276" y="278" width="8" height="8" />
    <rect x="296" y="250" width="8" height="8" /><rect x="404" y="290" width="8" height="8" />
    <rect x="424" y="290" width="8" height="8" /><rect x="538" y="330" width="8" height="8" />
  </g>
  <rect width="700" height="600" fill="#ff8ac2" opacity="0.06" />
  <rect width="700" height="600" filter="url(#grain-city)" opacity="0.14" style="mix-blend-mode:overlay" />
</svg>
