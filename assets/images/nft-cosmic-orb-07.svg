<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600" role="img">
  <defs>
    <linearGradient id="bg-cosmic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b2ff5" />
      <stop offset="100%" stop-color="#150a33" />
    </linearGradient>
    <filter id="soft-cosmic" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="grain-cosmic" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="700" height="600" fill="#0d0620" />
  <g filter="url(#soft-cosmic)" opacity="0.95">
      <circle cx="570" cy="81" r="143" fill="#8b5cf6" />
      <circle cx="461" cy="316" r="152" fill="#2563eb" />
      <circle cx="526" cy="521" r="162" fill="#e879f9" />
      <circle cx="221" cy="300" r="197" fill="#312e81" />
  </g>
  
  <g fill="none" stroke="#dcd0ff" opacity="0.35">
    <circle cx="350" cy="300" r="150" stroke-width="1.5" />
    <circle cx="350" cy="300" r="205" stroke-width="1" />
    <circle cx="350" cy="300" r="265" stroke-width="0.75" />
  </g>
  <rect width="700" height="600" fill="#c9a6ff" opacity="0.06" />
  <rect width="700" height="600" filter="url(#grain-cosmic)" opacity="0.14" style="mix-blend-mode:overlay" />
</svg>
