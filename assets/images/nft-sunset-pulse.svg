<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600" role="img">
  <defs>
    <linearGradient id="bg-sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <filter id="soft-sunset" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="grain-sunset" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="700" height="600" fill="#2b0a17" />
  <g filter="url(#soft-sunset)" opacity="0.95">
      <circle cx="72" cy="474" r="190" fill="#fb923c" />
      <circle cx="402" cy="210" r="238" fill="#f43f5e" />
      <circle cx="502" cy="508" r="112" fill="#fcd34d" />
      <circle cx="557" cy="126" r="210" fill="#7c3aed" />
  </g>
  
  <g fill="none" stroke="#ffe9c7" opacity="0.35">
    <circle cx="350" cy="320" r="150" stroke-width="1.5" />
    <circle cx="350" cy="320" r="205" stroke-width="1" />
    <circle cx="350" cy="320" r="265" stroke-width="0.75" />
  </g>
  <rect width="700" height="600" fill="#fed7aa" opacity="0.06" />
  <rect width="700" height="600" filter="url(#grain-sunset)" opacity="0.14" style="mix-blend-mode:overlay" />
</svg>
