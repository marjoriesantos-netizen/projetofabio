<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600" role="img">
  <defs>
    <linearGradient id="bg-fox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <filter id="soft-fox" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="grain-fox" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="700" height="600" fill="#2b1503" />
  <g filter="url(#soft-fox)" opacity="0.95">
      <circle cx="421" cy="488" r="216" fill="#f59e0b" />
      <circle cx="435" cy="148" r="178" fill="#ea580c" />
      <circle cx="611" cy="481" r="197" fill="#facc15" />
      <circle cx="624" cy="93" r="220" fill="#7c2d12" />
  </g>
  
  <g stroke="#2b1503" stroke-width="4" fill="none" opacity="0.75" stroke-linejoin="round">
    <path d="M180 470 L300 120 L420 470 Z" />
    <path d="M420 470 L520 190 L620 470 Z" />
    <path d="M300 120 L350 300 L420 470" />
  </g>
  <g fill="#fff3d6" opacity="0.65">
    <path d="M300 120 L350 300 L330 250 Z" />
  </g>
  <rect width="700" height="600" fill="#fcd34d" opacity="0.06" />
  <rect width="700" height="600" filter="url(#grain-fox)" opacity="0.14" style="mix-blend-mode:overlay" />
</svg>
